name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

jobs:
  # unit tests
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js 24.x
        uses: actions/setup-node@v3.2.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm test
